---
id: vineyards-tiles
providerType: TILE
providerSubType: FEATURES
enabled: "${enable.vineyards:-true}"
seeding:
  runOnStartup: "${enable.seeding:-true}"
  maxThreads: 8
caches:
- type: IMMUTABLE
  storage: PER_JOB
  seeded: true
  levels:
    WebMercatorQuad:
      min: 5
      max: 14
    AdV_25832:
      min: 0
      max: 9
- type: DYNAMIC
  storage: PER_JOB
  seeded: false
  levels:
    WebMercatorQuad:
      min: 15
      max: 18
    AdV_25832:
      min: 10
      max: 13
tilesets:
  vineyards:
    id: vineyards
    center:
      lon: 7.35
      lat: 49.8
    levels:
      WebMercatorQuad:
        min: 5
        max: 16
        default: 8 
      AdV_25832:
        min: 0
        max: 11
        default: 3
    transformations:
      WebMercatorQuad:
      - min: 5
        max: 7
        merge: true
        groupBy:
        - region
      - min: 8
        max: 8
        merge: true
        groupBy:
        - region
        - subregion
      - min: 9
        max: 9
        merge: true
        groupBy:
        - region
        - subregion
        - cluster
      AdV_25832:
      - min: 0
        max: 2
        merge: true
        groupBy:
        - region
      - min: 3
        max: 3
        merge: true
        groupBy:
        - region
        - subregion
      - min: 4
        max: 4
        merge: true
        groupBy:
        - region
        - subregion
        - cluster
