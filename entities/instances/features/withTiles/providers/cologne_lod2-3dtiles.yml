---
id: cologne_lod2-3dtiles
providerType: 3DTILE
providerSubType: FEATURES
enabled: "${enable.cologne_lod2:-false}"
seeding:
  runOnStartup: "${enable.seeding:-true}"
caches:
- type: DYNAMIC
  levels:
    min: 0
    max: 2
tilesets:
  building:
    id: building
    featureProvider: cologne_lod2
    featureType: building
    clampToEllipsoid: true
    geometricErrorRoot: 4096.0
    subtreeLevels: 3
    contentLevels:
      min: 0
      max: 2
    tileFilters:
    - true
    - diameter3d("bbox")<=100
    - diameter3d("bbox")<=50
    contentFilters:
    - diameter3d("bbox")>100
    - diameter3d("bbox")>50 and diameter3d("bbox")<=100
    - diameter3d("bbox")<=50
